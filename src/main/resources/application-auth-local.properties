# Applied only when auth-local is explicitly selected; does not activate the profile.
server.address=127.0.0.1
server.port=8081

# Datasource inherited from application.properties: DB_URL, DB_USER, DB_PASSWORD.
# Keep schema and SQL initialization under separate, explicit authorization.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Do not emit SQL statements, bound parameters or extracted JDBC values.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
